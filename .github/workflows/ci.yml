name: CI
on:
  push:
    branches: [main]
  pull_request:
# Both jobs only read the repository; the report upload uses the Actions runtime token, not GITHUB_TOKEN.
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter @society/web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: example

  # Every migration applied, in order and then again, to a real Postgres with a stand-in for the parts of
  # Supabase they rely on, followed by the checks in supabase/tests/checks.sql (grants, RLS, commit_table).
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - run: supabase/tests/apply.sh
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres

  # Browser tests against a production build of its own: the fake Supabase's address is baked into the
  # client bundle, so this job never shares a build with the check job above.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @society/web exec playwright install --with-deps chromium
      - name: Build against the fake Supabase
        run: pnpm --filter @society/web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:3499
          NEXT_PUBLIC_SUPABASE_ANON_KEY: e2e-anon-key
      - run: pnpm --filter @society/web test:e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/e2e/playwright-report
            apps/web/e2e/test-results
          retention-days: 14
