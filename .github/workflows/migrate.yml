name: Migrate and deploy
# Production, in order: apply any new migration to the Supabase project, then deploy the app, so the
# code never runs against a database that doesn't have its columns yet. Every push to main goes this
# way; with no new migration, the first step does nothing.
#
# One-time setup (docs/DATA-MODEL.md, "Setting up the pipeline"): a GitHub environment named
# production, limited to main, holding the secrets SUPABASE_DB_URL and VERCEL_DEPLOY_HOOK; then one
# manual run with "adopt" ticked. Until SUPABASE_DB_URL exists this workflow does nothing.
#
# Access: SUPABASE_DB_URL is the one project's database connection, nothing account-wide. It never
# touches Supabase's management API. It lives only in the environment, so only jobs on main can read
# it.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      adopt:
        description: 'Adopt (first run only): record 0001-0004, which were run by hand, as already applied'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  migrate:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    outputs:
      ready: ${{ steps.setup.outputs.ready }}
    steps:
      - name: Check the pipeline is set up
        id: setup
        run: |
          if [ -n "$DB_URL" ]; then echo "ready=yes" >> "$GITHUB_OUTPUT"
          else echo "::notice::No SUPABASE_DB_URL secret yet, so nothing is migrated or deployed from here. Setup: docs/DATA-MODEL.md."; fi
      - if: steps.setup.outputs.ready == 'yes'
        uses: actions/checkout@v4
      - if: steps.setup.outputs.ready == 'yes'
        uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: Adopt the migrations run by hand
        if: steps.setup.outputs.ready == 'yes' && inputs.adopt
        run: supabase migration repair --status applied 0001 0002 0003 0004 --db-url "$DB_URL"
      - name: Show what will run
        if: steps.setup.outputs.ready == 'yes'
        run: supabase migration list --db-url "$DB_URL"
      - if: steps.setup.outputs.ready == 'yes'
        run: supabase db push --db-url "$DB_URL" --yes
  deploy:
    needs: migrate
    if: needs.migrate.outputs.ready == 'yes'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Deploy to Vercel
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "No VERCEL_DEPLOY_HOOK: Vercel's own git deploy is still on."; exit 0; fi
          curl -fsS -X POST "$HOOK"
